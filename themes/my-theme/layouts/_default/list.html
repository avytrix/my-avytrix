{{ define "main" }}
<!-- Page Header Banner -->
<div class="page-header">
    <div class="container">
        <h1>{{ .Title }}</h1>
    </div>
</div>

<div class="container single-content">
    <!-- Render the content from the _index.md file -->
    <!-- List all child pages in a grid -->
    <div class="list-pages-grid">
        {{ range .Pages }}
            <a href="{{ .Permalink }}" class="service-card">
                <h3>{{ .Title }}</h3>             
            </a>
        {{ end }}
    </div>
</div>
{{ end }}
