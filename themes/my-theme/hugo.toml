baseURL = 'https://www.viliha.com'
languageCode = 'en-us'
title = 'Viliha Web Services'
theme = 'my-theme'
image = 'https://ik.imagekit.io/viliha/images/viliha_home.png'

# Enable multilingual support for the translator
[languages]
  [languages.en]
    title = "Viliha Web Services"
    weight = 1
    languageName = "English"

# --- Main Menu (Simplified) ---
# We only define the top-level items here.
# The "Services" mega menu will be built from the 'params' section below.
[menu]
  [[menu.main]]
    name = 'Home'
    url = '/'
    weight = 10
  [[menu.main]]
    name = 'Services'
    url = '#' # This link won't go anywhere; it just triggers the dropdown.
    weight = 20
    identifier = 'services' # This is how we identify our special menu item.
  [[menu.main]]
    name = 'About Us'
    url = '/about-us/'
    weight = 30

# --- Footer Menus (Remain the same) ---
[[menu.footer_services]]
  name = "Custom Software Solutions"
  url = "/services/custom-software-development/"
  weight = 1
[[menu.footer_services]]
  name = "Web Application Development"
  url = "/services/web-development/"
  weight = 2
[[menu.footer_services]]
  name = "Mobile App Development"
  url = "/services/mobile-app-development/"
  weight = 3
[[menu.footer_services]]
  name = "UX/UI Design Services"
  url = "/services/ux-ui-design/"
  weight = 4
[[menu.footer_services]]
  name = "Cloud & DevOps Services"
  url = "/services/cloud-solutions/"
  weight = 5
[[menu.footer_services]]
  name = "Dedicated Teams"
  url = "/services/dedicated-development-teams/"
  weight = 6

# Footer Menu - Company Column
[[menu.footer_company]]
  name = "About Us"
  url = "/about-us/"
  weight = 1
[[menu.footer_company]]
  name = "Contact Us"
  url = "/contact/"
  weight = 2
[[menu.footer_company]]
  name = "Privacy Policy"
  url = "/privacy-policy/"
  weight = 3
[[menu.footer_company]]
  name = "Terms of Service"
  url = "/terms-conditions/"
  weight = 4


# --- NEW: Data for our Services Mega Menu ---
[params]
  description = "Viliha Services architects cutting-edge, user-centric digital platforms..."
  keywords = "custom software, web development, mobile app development, ux/ui design..."
  image = "https://ik.imagekit.io/viliha/images/viliha banner.png"
  recaptcha_site_key = "6LdkkXorAAAAAHQbCUTBx90vatSQhwAsR5iZjbZi"

  # This is where we define the columns for our mega menu
  [params.mega_menu]
    [[params.mega_menu.columns]]
      title = "Software Development"
      links = [
        { name = "Custom Software Solutions", url = "/services/custom-software-development/" },
        { name = "Web Application Development", url = "/services/web-development/" },
        { name = "Mobile App Development", url = "/services/mobile-app-development/" },
        { name = "UX/UI Design Services", url = "/services/ux-ui-design/" },
        { name = "E-commerce & Enterprise", url = "/services/ecommerce-solutions/" }
      ]
    [[params.mega_menu.columns]]
      title = "Infrastructure & Teams"
      links = [
        { name = "Cloud Solutions & Infrastructure", url = "/services/cloud-solutions/" },
        { name = "Software QA & Testing", url = "/services/qa-and-testing/" },
        { name = "API Development & Integration", url = "/services/api-development/" },
        { name = "Dedicated Development Teams", url = "/services/dedicated-development-teams/" },
        { name = "Ongoing Support & Maintenance", url = "/services/ongoing-support/" }
      ]
  
  # --- 2. NEW: Data for Footer Menu ---
  # Notice the completely new name: 'footer_menu'
  [params.footer_menu]
    # This defines an array of columns directly under 'footer_menu'
    [[params.footer_menu.columns]]
      title = "Services" # Column 1 Title
      opacity = 1
      links = [
        { name = "Custom Software Solutions", url = "/services/custom-software-development/" },
        { name = "Web Application Development", url = "/services/web-development/" },
        { name = "Mobile App Development", url = "/services/mobile-app-development/" },
        { name = "UX/UI Design Services", url = "/services/ux-ui-design/" },
        { name = "E-commerce & Enterprise", url = "/services/ecommerce-solutions/" }
      ]
    [[params.footer_menu.columns]]
      title = "Migration Services" # Column 2 Title
      opacity = 1
      links = [
        { name = "Cloud Solutions & Infrastructure", url = "/services/cloud-solutions/" },
        { name = "Software QA & Testing", url = "/services/qa-and-testing/" },
        { name = "API Development & Integration", url = "/services/api-development/" },
        { name = "Dedicated Development Teams", url = "/services/dedicated-development-teams/" },
        { name = "Ongoing Support & Maintenance", url = "/services/ongoing-support/" },
      ]
    [[params.footer_menu.columns]]
      title = "Company" # Column 3 Title
      opacity = 1
      links = [
        { name = "About Us", url = "/about-us/" },
        { name = "Contact Us", url = "/contact/" },
        { name = "Privacy Policy", url = "/privacy-policy/" },
        { name = "Terms & Conditions", url = "/terms-conditions/" }
      ]