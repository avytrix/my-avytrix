{{ define "main" }}
<!-- Page Header Banner -->
<div class="page-header">
    <div class="container">
        <h1>{{ .Title }}</h1>
    </div>
</div>

<div class="container">
    <section class="single-content" style="padding-top: 0;">
        <!-- Render the introductory content from the _index.md file -->
        {{ .Content }}

        <!-- Display all technology pages in a grid -->
        <div class="services-grid" style="margin-top: 3rem;">
            {{ range .Pages }}
            <a href="{{ .Permalink }}" class="service-card" style="text-align: center;">
                {{ with .Params.logo }}
                <!--
                  THE FIX IS HERE: We use $.Title to refer to the page's title,
                  because the dot (.) inside the 'with' block refers to the logo URL string.
                -->
                <img src="{{ . | relURL }}" alt="{{ $.Title }} Logo" style="height: 80px; width: auto; object-fit: contain; margin-bottom: 1.5rem;">
                {{ end }}
                <h3>{{ .Title }}</h3>
            </a>
            {{ end }}
        </div>
    </section>
</div>
{{ end }}
