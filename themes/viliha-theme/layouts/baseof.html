<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | {{ .Site.Title }}</title>   
    {{ partial "favicons.html" . }}
    
    {{ partial "meta.html" . }}
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">   
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @tailwind base;
        @tailwind components;
        @tailwind utilities;
        @layer base {
            /* disable dark mode by forcing light context */
            html.dark {
                color-scheme: light;
            }
        }

        body {
            font-family: 'Poppins', sans-serif;
        
            top:58px !important;
            position: relative;
        }
        .container-1200px {
            max-width: 1180px;
            margin: 0 auto;
        }
        .submenu {
            display: none;
        }
        .submenu.active {
            display: block;
        }
        details > summary {
            list-style: none;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }
         h1,h2{
            font-size: 36px !important;
        }
        /* Custom arrow styling */
        .arrow {
            width: 8px;
            height: 8px;
            border-left: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            transform: rotate(-45deg);
            transition: transform 0.3s ease-in-out;
        }
        .custom-select-wrapper.open .arrow {
            transform: rotate(135deg);
        }
        button,a{
            cursor: pointer;
        }
        @media (max-width: 768px) {
            h1,h2{
                font-size: 28px !important;
            }
            #tech-frontend, #tech-databases {
                justify-content: space-evenly;
            }
        }
        @media (max-width:1024px) {
            .tech-stack-list-button-column {
                width: 100%;
                gap: 10px;
                overflow-y: auto;
                padding: 1rem 0;
            }
        }
        details[open] .faq-question-summary .icon::before {
        content: "-";  /* replace + with - when open */
        }
        details:not([open]) .faq-question-summary .icon::before {
        content: "+";  /* default */
        }
        .skiptranslate{
            display: none !important;
        }
        /* tailwind.config.css or your main css */
        .active-lang {
             @apply bg-blue-600 text-white;
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: #0058EE #f1f1f1; /* thumb track */
        }
        

    </style>
    {{ block "head-end" . }}{{ end }}
</head>
<body>
    
    <div id="main-content w-full margin-auto">
        <!-- Header Partial -->
        {{ partial "header.html" . }}
        <div id="content" class="container-1200px">
            <!-- The content of each page will be rendered here -->
            {{ block "main" . }}{{ end }}
        </div>
        
    </div>
    <!-- Footer Partial -->
        {{ partial "footer.html" . }}
    
    <!-- Main JavaScript -->
    <script src="{{ "js/main.js" | relURL }}"></script>
</body>
</html>
