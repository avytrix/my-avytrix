<!-- 
  FORM FUNCTIONALITY:
  This form is set up for Netlify Forms. 
  If you are NOT hosting on Netlify, see instructions on how to use a service like Formspree.
-->
<form name="contact" method="POST" data-netlify="true" class="contact-form">
  <div class="form-group">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>
  </div>
  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required>
  </div>
   <div class="form-group">
    <label for="phone">Phone Number (Optional)</label>
    <input type="tel" id="phone" name="phone">
  </div>
   <div class="form-group">
    <label for="subject">Subject / Service of Interest</label>
    <select name="subject" class="solaceform-style-field">
				<option value="Select">Select</option>
			  <option value="Custom Software Development">Custom Software Development</option>
				<option value="Web Development">Web Development</option>
				<option value="Mobile App Development">Mobile App Development</option>
				<option value="Other ">Other </option>
		</select>
  </div>
  <div class="form-group">
    <label for="message">Your Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>
  </div>
  <div class="form-group">
    <button type="submit" class="btn">Send Message</button>
  </div>
</form>
