{{ define "main" }}
<div class="container mx-auto px-4 py-16 text-center max-w-2xl">

    <img src="{{ "https://ik.imagekit.io/viliha/images/404-page.svg" | relURL }}"
         alt="Illustration for a 404 Page Not Found error" 
         class="mx-auto mb-8 max-w-sm">

    <h1 class="text-4xl font-bold mb-4">404 - Page Not Found</h1>
    
    <p class="text-gray-600 mb-6">
        Oops! The page you're looking for might have been moved, deleted, or perhaps it never existed. Let's get you back on track.
    </p>

    <a href="{{ .Site.BaseURL }}" 
       class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg shadow-md transition">
       Go to Homepage
    </a>

    <div class="helpful-links mt-10">
        <h4 class="text-lg font-semibold mb-4">Here are some helpful links instead:</h4>
        <ul class="space-y-2">
            <li><a href="/about-us/" class="text-blue-600 hover:underline">About Us</a></li>
            <li><a href="/contact/" class="text-blue-600 hover:underline">Contact Us</a></li>
        </ul>
    </div>

</div>
{{ end }}
